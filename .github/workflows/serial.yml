name: Build (serial)
# Half the build minutes, same total duration!

# Serial baseline: every quality check runs sequentially in a single job.
# This is the apples-to-apples comparison for the bitrab parallel run —
# same checks, same scripts, one runner, no overlap.
# Compare wall-clock minutes against build.yml (parallel GHA) and the
# bitrab quality-gate job to measure the value of parallelism.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: .venv
  UV_CACHE_DIR: .uv
  PACKAGE_DIR: bitrab

jobs:
  quality-serial:
    name: Quality gate (serial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            .uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: Mypy
        run: ./scripts/mypy.sh

      - name: Pre-commit
        run: ./scripts/precommit.sh

      - name: Pytest
        run: ./scripts/pytest.sh

      - name: Bandit
        run: ./scripts/bandit.sh

      - name: Check docs
        run: ./scripts/check_docs.sh

      - name: Hatch build
        run: ./scripts/build_package.sh

[tox]
envlist =
;    py39 ; end of life and gets in the way of minimum pins for lib versions
    py311
    py312
    py313
    py314
    py315

requires =
    tox-uv>=1.28

[testenv]
extras =
    fast
deps =
    # parameterized
    pytest>=7.4.4
    pytest-cov>=4.1.0
    toml;python_version<'3.11'
    pytest-benchmark>=4.0.0
    hypothesis>=6.96.0
    pytest_mock
    pytest-xdist>=3.5.0
commands =
    pytest test -q -n 5  --dist=loadfile --cov=bitrab --cov-fail-under=35 -p no:benchmark
    python scripts/run_benchmarks.py test_perf/test_perf.py test_perf/test_perf_fast.py --benchmark-min-rounds=5 --benchmark-min-time=0.1 -p no:xdist
    ;pytest test -vv no:xdist --benchmark-only
setenv =
    PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1

# py315: exclude default groups (including dev) to avoid google-re2/orjson
# which have no cp315 wheels. google-re2 is pulled in by the dev group via
# keepachangelog-manager-fork[all]. orjson is in the fast extras.
[testenv:py315]
runner = uv-venv-lock-runner
uv_sync_flags = --no-default-groups
extras =
deps = {[testenv]deps}
commands = {[testenv]commands}
setenv = {[testenv]setenv}
